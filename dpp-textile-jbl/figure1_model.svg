<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="440" viewBox="0 0 1150 440" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1150" height="440" fill="#fff"/>

  <!-- Conditions -->
  <rect x="20" y="60" width="230" height="290" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="1.6"/>
  <text x="135" y="88" text-anchor="middle" font-weight="bold">Conditions</text>
  <g font-size="14" fill="#111">
    <text x="38" y="125">VI   Vertical integration</text>
    <text x="38" y="170">DTC  Digital traceability</text>
    <text x="38" y="215">MDS  Multi-tier data sharing</text>
    <text x="38" y="260">BTP  Buyer pressure</text>
    <text x="38" y="305">DAC  Data-appropriation concern</text>
  </g>
  <text x="135" y="380" text-anchor="middle" font-size="13" font-style="italic" fill="#333">P2: DTC necessary for high readiness</text>

  <!-- Configurations -->
  <g fill="#fff" stroke="#222" stroke-width="1.6">
    <rect x="330" y="60"  width="290" height="70" rx="8"/>
    <rect x="330" y="160" width="290" height="70" rx="8"/>
    <rect x="330" y="280" width="290" height="70" rx="8" stroke-dasharray="6,4"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="475" y="88" font-weight="bold">Integrated route (P1)</text>
    <text x="475" y="113">VI ● DTC</text>
    <text x="475" y="188" font-weight="bold">Networked route (P1)</text>
    <text x="475" y="213">MDS ● DTC ● ~DAC</text>
    <text x="475" y="308" font-weight="bold">Pressure under suspicion (P3)</text>
    <text x="475" y="333">BTP ● DAC ● ~VI</text>
  </g>

  <!-- Outcomes -->
  <g fill="#fff" stroke="#222" stroke-width="1.6">
    <rect x="720" y="105" width="190" height="70" rx="8"/>
    <rect x="720" y="280" width="190" height="70" rx="8"/>
    <rect x="975" y="105" width="160" height="70" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#111">
    <text x="815" y="135">High DPP</text>
    <text x="815" y="155">readiness</text>
    <text x="815" y="310">Low DPP</text>
    <text x="815" y="330">readiness</text>
    <text x="1055" y="135">Circular SC</text>
    <text x="1055" y="155">capability</text>
  </g>

  <path d="M250,205 L290,205 M290,95 L290,315" stroke="#222" stroke-width="1.6" fill="none"/>
  <!-- Arrows -->
  <g stroke="#222" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M290,95 L328,95"/>
    <path d="M290,195 L328,195"/>
    <path d="M290,315 L328,315"/>
    <path d="M620,95 L718,128"/>
    <path d="M620,195 L718,152"/>
    <path d="M620,315 L718,315"/>
    <path d="M910,140 L973,140" stroke-dasharray="6,4"/>
  </g>
  <text x="942" y="200" text-anchor="middle" font-size="13" font-style="italic" fill="#333">P4: not sufficient</text>
  <text x="942" y="217" text-anchor="middle" font-size="13" font-style="italic" fill="#333">on its own</text>

  <text x="20" y="425" font-size="13" fill="#444">● = combined with (logical AND); ~ = absence of the condition. Each route is expected to be sufficient on its own (equifinality); low readiness has its own explanation (asymmetry).</text>
</svg>
