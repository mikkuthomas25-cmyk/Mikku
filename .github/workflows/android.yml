name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the APK as a GitHub Release (direct download link)"
        type: boolean
        default: false

permissions:
  contents: write   # only used to attach the APK to a release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Add Firebase config (enables Google / email login)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FinTrack.apk

      - name: Verify APK (signature, supported Android versions)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs FinTrack.apk | grep -E "Verifies|Verified using|SHA-1|SHA1|Number of signers"
          "$BT/aapt2" dump badging FinTrack.apk | grep -E "^package:|sdkVersion|minSdk|targetSdkVersion|native-code|testOnly|application-debuggable" || true
          ls -l FinTrack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FinTrack-apk
          path: android/FinTrack.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          # Manual runs create their own tag, e.g. v1.0.7.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: FinTrack ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
          body: |
            Download **FinTrack.apk** below and open it on your Android phone (Android 8.0+).
            Xiaomi / HyperOS: open it from Xiaomi's File Manager; if it says "App not installed",
            turn off "Scan apps before installing" in the Security app, install, then turn it back on.
          make_latest: true
          files: android/FinTrack.apk
