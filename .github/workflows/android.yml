name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the APK to a release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Add Firebase config (enables Google / email login)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FinTrack.apk

      - name: Verify APK (signature, supported Android versions)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs FinTrack.apk | grep -E "Verifies|Verified using|SHA-1|SHA1|Number of signers"
          "$BT/aapt2" dump badging FinTrack.apk | grep -E "^package:|sdkVersion|targetSdkVersion|native-code|testOnly|application-debuggable" || true
          ls -l FinTrack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FinTrack-apk
          path: android/FinTrack.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/FinTrack.apk
